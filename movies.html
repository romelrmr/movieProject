<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HP Series</title>
    <link rel="stylesheet" href="/style.css">
    <script src="index.js"></script>
    <script src="https://kit.fontawesome.com/9f094611fb.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav id="pageContainer">
        <div class="nav__bar">
            <div class="nav__header">
                <div class="nav__logo">
                    <img class="logo" src="HP houses.png" alt="hpHouses">
                </div>
                <div class="nav__links">
                    <a href="/index.html" class="
                    nav__link--anchor
                    link__hover-effect
                    ">Home</a>
                    <a href="#" class="
                    nav__link--anchor
                    nav__link--anchor-primary
                    link__hover-effect
                    ">Purchase</a>
                </div>
            </div>
            <div class="searchBar">
                <h1>Browse for Series</h1>
                <div class="searchWrap">
                    <input class="search" type="text" placeholder="Search by Title">
                    <i class="fa-brands fa-searchengin"></i>
                </div>
            </div>
            <div class="background"></div>
        </div>
    </nav>
    <div class="movieList">
        <div class="movie-list__container"></div>
    </div>
</body>
</html>
